<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Trabajo con funciones</h1>

    <!-- Mayor -->
    <h2>1. Número mayor</h2>
    <input type="number" id="num1Mayor" placeholder="Número 1">
    <input type="number" id="num2Mayor" placeholder="Número 2">
    <button onclick="numeroMayor()">Verificar mayor</button>
    <p id="resultadoMayor"></p>

    <!-- Menor -->
    <h2>2. Número menor</h2>
    <input type="number" id="num1Menor" placeholder="Número 1">
    <input type="number" id="num2Menor" placeholder="Número 2">
    <button onclick="numeroMenor()">Verificar menor</button>
    <p id="resultadoMenor"></p>

    <!-- Iguales o diferentes -->
    <h2>3. Iguales o diferentes</h2>
    <input type="number" id="num1Igual" placeholder="Número 1">
    <input type="number" id="num2Igual" placeholder="Número 2">
    <button onclick="compararNumeros()">Comparar</button>
    <p id="resultadoIgual"></p>

    <!-- IVA -->
    <h2>4. Calcular IVA</h2>
    <input type="number" id="compra" placeholder="Valor de la compra">
    <button onclick="calcularIVA()">Calcular IVA</button>
    <p id="resultadoIVA"></p>

    <!-- Saludo -->
    <h2>5. Saludar</h2>
    <input type="text" id="nombre" placeholder="Escribí tu nombre">
    <button onclick="saludar()">Saludar</button>
    <p id="resultadoSaludo"></p>

    <!-- Modo oscuro y claro -->
    <h2>6. Cambiar modo</h2>
    <button onclick="modoOscuro()">Modo oscuro</button>
    <button onclick="modoClaro()">Modo claro</button>

</body>
</html>
